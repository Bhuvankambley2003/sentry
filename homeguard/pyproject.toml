[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeguard"
version = "0.1.0"
description = "Home network security — who's on my Wi-Fi?"
requires-python = ">=3.11"
dependencies = [
    # API / services
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    # Messaging
    "redis>=5.0.4",
    # Storage
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    # Network
    "scapy>=2.5.0",
    "zeroconf>=0.132.2",
    "netifaces>=0.11.0",
    # CLI
    "typer>=0.12.3",
    "rich>=13.7.1",
    # Utilities
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "respx>=0.21.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[project.scripts]
homeguard = "cli.homeguard:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "services*", "cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
